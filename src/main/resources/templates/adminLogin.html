<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/common.css" rel="stylesheet">
</head>
<body class="login-body">

<div class="login-wrapper">
    <div class="login-card">
        <div class="login-header">
            <div class="icon-circle">
                <i class="bi bi-shield-lock"></i>
            </div>
            <h1>Admin</h1>
            <p>Entre com suas credenciais</p>
        </div>

        <!-- Thymeleaf: uncomment to show on error -->
        <!-- <div class="alert-bar show" th:if="${param.error}">
            <i class="bi bi-exclamation-circle"></i> Usuário ou senha inválidos.
        </div> -->

        <div class="alert-bar" id="errorBar">
            <i class="bi bi-exclamation-circle"></i>
            <span id="errorMsg">Usuário ou senha inválidos.</span>
        </div>

        <form action="/adminLogin" method="post">
            <div class="form-floating">
                <input type="text" class="form-control" id="name" name="name"
                       placeholder="Usuário" required autocomplete="username">
                <label for="name"><i class="bi bi-person me-1"></i>Usuário</label>
            </div>

            <div class="form-floating password-wrapper">
                <input type="password" class="form-control" id="password" name="password"
                       placeholder="Senha" required autocomplete="current-password">
                <label for="password"><i class="bi bi-key me-1"></i>Senha</label>
                <button type="button" class="password-toggle" onclick="togglePassword()" tabindex="-1" aria-label="Mostrar senha">
                    <i class="bi bi-eye" id="eyeIcon"></i>
                </button>
            </div>

            <button type="submit" class="btn-login">Entrar</button>
        </form>
    </div>
</div>

<script src="/js/common.js"></script>
</body>
</html>
